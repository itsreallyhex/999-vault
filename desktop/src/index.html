<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>999</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/launch.css">
</head>
<body class="launch">
  <!-- The 999 mark, same shapes the site uses, defined once and pulled in
       by <use>. Parked off screen rather than hidden: an SVG that is not
       rendered stops resolving the gradient below. -->
  <svg class="mark-defs" aria-hidden="true" focusable="false">
    <linearGradient id="mark-grad" gradientUnits="userSpaceOnUse" x1="4" y1="10" x2="44" y2="38">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <symbol id="mark999" viewBox="0 10 48 28" fill="none" stroke-linecap="round">
      <circle cx="9.5" cy="19" r="5.5"/>
      <path d="M15 19 V28.5 Q15 34.5 9 34.5"/>
      <circle cx="24" cy="19" r="5.5"/>
      <path d="M29.5 19 V28.5 Q29.5 34.5 23.5 34.5"/>
      <circle cx="38.5" cy="19" r="5.5"/>
      <path d="M44 19 V28.5 Q44 34.5 38 34.5"/>
    </symbol>
  </svg>

  <main class="launch-in">
    <div class="launch-mark" aria-hidden="true">
      <svg class="mark"><use href="#mark999"/></svg>
    </div>
    <h1 class="sr-only">999</h1>
    <p class="launch-deck">The archive, on this machine.</p>

    <nav class="launch-picks" aria-label="Where to go">
      <a class="pick" href="vault.html">
        <span class="pick-name">Open Vault</span>
        <span class="pick-note">Every entry the archive holds. Search, filter and play.</span>
        <span class="pick-figure" id="figVault">&nbsp;</span>
      </a>

      <a class="pick" href="playlists.html">
        <span class="pick-name">Open Playlists</span>
        <span class="pick-note">Your own running orders, saved on this machine.</span>
        <span class="pick-figure" id="figPlaylists">&nbsp;</span>
      </a>
    </nav>

    <p class="launch-status" id="status">Looking for the archive...</p>
  </main>

  <script type="module" src="js/launch.js"></script>
</body>
</html>
