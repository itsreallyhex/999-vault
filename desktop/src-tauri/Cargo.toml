[package]
name = "vault999"
version = "0.1.0"
description = "999, as a desktop app. Vault and playlists only."
edition = "2021"
rust-version = "1.77"

[lib]
# The desktop binary is a thin wrapper around this, which is also what a
# mobile target would call. Keeping run() in the library rather than in
# main.rs is the shape Tauri expects.
name = "vault999_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# Writing a setting back into config.toml without losing the comments
# the template put there. `toml` alone would flatten the file.
toml_edit = "0.22"
# The native folder picker behind Settings > Data folder. Called from
# an async command so its blocking dialog never sits on the main thread.
rfd = "0.15"
# Watches the pages folder so an edit reloads the window by itself.
# Only started when the pages come from a checkout. See watch.rs.
notify = "8"
# Discord Rich Presence over the local IPC pipe. Pure Rust, no native
# blob; a missing Discord is an ordinary connect error. See presence.rs.
discord-rich-presence = "1"
