<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>999 mark preview</title>
<style>
  :root{--accent:#8B5CF6;--accent-2:#C4B5FD;--line-2:#372F49;--c-released:#86EFAC;
        --bg:#08070C;--bg-3:#191622;--text:#F6F4FB;--faint:#6E6685}
  body{background:var(--bg);color:var(--text);font:14px/1.6 system-ui,sans-serif;margin:0;padding:2.5rem}
  h1{font-size:1rem;color:var(--faint);font-weight:600;letter-spacing:.14em;text-transform:uppercase}
  .row{display:flex;align-items:flex-end;gap:2.5rem;flex-wrap:wrap;
       padding:1.75rem 0;border-bottom:1px solid #241F31}
  .cell{display:flex;flex-direction:column;align-items:center;gap:.6rem}
  .cap{font-size:11px;color:var(--faint);font-family:ui-monospace,monospace}
  .mark-defs{position:absolute;width:0;height:0;overflow:hidden}
  .mark{display:block;flex:none;height:1em;width:calc(1em * 12 / 7);stroke-width:3.2}
  .brand{font-size:1.2rem;stroke:url(#mark-grad)}
  .fav{font-size:16px;stroke:#C4B5FD}
  .fav32{font-size:32px;stroke:#C4B5FD}
  .tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;
        background:linear-gradient(140deg,#8B5CF6,#EC4899);font-size:.62rem;stroke:#fff}
  .hero{font-size:7rem;stroke:url(#mark-grad)}
  .muted{font-size:2rem;stroke:var(--line-2)}
  .card{font-size:3.6rem;stroke:var(--c-released);stroke-width:2.2;opacity:.5}
  .water{font-size:14rem;stroke:rgba(139,92,246,.14);stroke-width:1.1}
  .onlight{background:#F6F4FB;padding:1rem;border-radius:8px}
</style></head><body>
<svg class="mark-defs" aria-hidden="true">
  <linearGradient id="mark-grad" gradientUnits="userSpaceOnUse" x1="4" y1="10" x2="44" y2="38">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#C4B5FD"/><stop offset="1" stop-color="#8B5CF6"/>
  </linearGradient>
  <symbol id="mark999" viewBox="0 10 48 28" fill="none" stroke-linecap="round">
    <circle cx="9.5" cy="19" r="5.5"/><path d="M15 19 V28.5 Q15 34.5 9 34.5"/>
    <circle cx="24" cy="19" r="5.5"/><path d="M29.5 19 V28.5 Q29.5 34.5 23.5 34.5"/>
    <circle cx="38.5" cy="19" r="5.5"/><path d="M44 19 V28.5 Q44 34.5 38 34.5"/>
  </symbol>
</svg>

<h1>The sizes it actually gets used at</h1>

<div class="row">
  <div class="cell"><span class="fav"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">16px favicon</span></div>
  <div class="cell"><span class="fav32"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">32px favicon</span></div>
  <div class="cell"><span class="tile"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">tribute nav tile 34px</span></div>
  <div class="cell"><span class="brand"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">nav brand 1.2rem</span></div>
  <div class="cell"><span class="muted"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">mosaic placeholder 2rem</span></div>
</div>

<div class="row">
  <div class="cell"><span class="card"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">card art, released hue</span></div>
  <div class="cell"><span class="fav onlight"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">16px on light</span></div>
</div>

<div class="row"><div class="cell"><span class="hero"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">landing hero, 7rem cap</span></div></div>

<div class="row"><div class="cell"><span class="water"><svg class="mark"><use href="#mark999"/></svg></span><span class="cap">tribute watermark, hairline</span></div></div>
</body></html>
